<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>注册 · User Service</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">

  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="wrap">
    <header class="page-head">
      <p class="kicker">user-service-web</p>
      <h1>注册</h1>
    </header>

    <div class="card">
      <h2>注册新账号</h2>
      <p class="sub">填三个字段，注册成功后回登录页。</p>

      <!-- 注册失败时，JS 去掉 hidden、改写 .alert-msg -->
      <div class="alert" hidden>
        <span>&#9888;</span>
        <div class="alert-msg"><b>这个邮箱已经注册过了。</b>换一个，或直接去登录。</div>
      </div>

      <div class="field">
        <label for="email">邮箱</label>
        <input id="email" type="email" placeholder="test@example.com" autocomplete="email">
      </div>
      <div class="field">
        <label for="first-name">名 first_name</label>
        <input id="first-name" type="text" placeholder="first name">
      </div>
      <div class="field">
        <label for="last-name">姓 last_name</label>
        <input id="last-name" type="text" placeholder="last name">
      </div>

      <button class="btn block" type="button" id="register-btn">注册</button>

      <p class="switch">已有账号？<a href="login.html">去登录</a></p>
    </div>
  </main>

  <script src="api.js"></script>
  <script>
    const btn = document.getElementById("register-btn");
    const emailInput = document.getElementById("email");
    const firstInput = document.getElementById("first-name");
    const lastInput = document.getElementById("last-name");
    const alertBox = document.querySelector(".alert");
    const alertMsg = document.querySelector(".alert-msg");

    btn.addEventListener("click", async () => {
      alertBox.hidden = true;

      const payload = {
        email: emailInput.value.trim(),
        first_name: firstInput.value.trim(),
        last_name: lastInput.value.trim(),
      };

      try {
        const res = await fetch(`${API_BASE}/users`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload),
        });

        if (res.status === 200) {
          // 注册成功 → 回登录页，带上刚注册的邮箱，登录页会预填 + 显示"注册成功"提示
          location.href =
            "login.html?registered=1&email=" + encodeURIComponent(payload.email);
          return;
        }

        if (res.status === 400) {
          alertMsg.innerHTML = "<b>这个邮箱已经注册过了。</b>换一个，或直接去登录。";
        } else if (res.status === 422) {
          alertMsg.innerHTML = "<b>填写有误。</b>邮箱格式要正确，三个字段都不能空。";
        } else {
          alertMsg.innerHTML = "<b>注册失败。</b>服务器返回状态码 " + res.status + "。";
        }
        alertBox.hidden = false;
      } catch (err) {
        alertMsg.innerHTML =
          "<b>连不上服务器。</b>确认后端已启动，且 CORS 已放行本页面。";
        alertBox.hidden = false;
        console.error(err);
      }
    });
  </script>
</body>
</html>
